[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycareer-skill-gap-cli"
version = "0.1.0"
description = "Mycareer Python curriculum capstone fixture"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skill-gap = "skill_gap_cli.cli:main"

[dependency-groups]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
